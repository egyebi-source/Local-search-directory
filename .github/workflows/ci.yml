name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI-only database; mirrors Neon's roles (owner has BYPASSRLS, app_user doesn't).
      TEST_DATABASE_URL: postgresql://app_user:ci_app@localhost:5432/app_test # gitleaks:allow
      TEST_DATABASE_URL_OWNER: postgresql://app_owner:ci_owner@localhost:5432/app_test # gitleaks:allow
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Create test database and roles
        env:
          PGPASSWORD: ci_superuser
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_owner LOGIN PASSWORD 'ci_owner' CREATEROLE BYPASSRLS;
          CREATE ROLE app_user LOGIN PASSWORD 'ci_app' NOBYPASSRLS;
          CREATE DATABASE app_test OWNER app_owner;
          SQL
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -c "ALTER SCHEMA public OWNER TO app_owner"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
